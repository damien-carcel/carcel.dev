version: 2.1

orbs:
  node: circleci/node@7.2.1

jobs:
  tests:
    executor: node/default
    steps:
      - checkout
      - node/install-bun
      - run:
          name: Install the latest Task binary
          command: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/bin
      - restore_cache:
          keys:
            - bun-{{ .Environment.CACHE_VERSION }}-{{ checksum "bun.lock" }}
            - bun-{{ .Environment.CACHE_VERSION }}-
      - run:
          name: Install dependencies
          command: task dependencies:install
      - save_cache:
          key: bun-{{ .Environment.CACHE_VERSION }}-{{ checksum "bun.lock" }}
          paths:
            - ./node_modules
            - ./.next/cache
      - run:
          name: Check the code style
          command: task tests:static:format:check
      - run:
          name: Lint the stylesheets
          command: task tests:static:style-sheet:lint
      - run:
          name: Lint the application code
          command: task tests:static:code:lint -- --format junit -o test_results/eslint.xml
      - run:
          name: Check the code typing
          command: task tests:static:types:check
      - run:
          name: Run unit tests
          command: task tests:unit -- --reporter=default --reporter=junit --outputFile=./test_results/unit.xml
      - store_artifacts:
          path: test_results
      - store_test_results:
          path: test_results

workflows:
  pull_request:
    jobs:
      - tests:
          filters:
            branches:
              ignore:
                - main
