version: 3

tasks:
  build:
    aliases:
      - b
    cmds:
      - bun run build
    desc: Run the production-like server

  dev:
    aliases:
      - d
    cmds:
      - bun run dev
    desc: Run the development server

  prod:
    aliases:
      - p
    cmds:
      - bun run preview
    desc: Run the production-like server
    deps:
      - build
