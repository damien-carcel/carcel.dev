version: 3

tasks:
  bash:
    aliases:
      - sh
    cmds:
      - docker compose run --rm --remove-orphans dev bash
    desc: Launch a shell in the development container

  build:
    aliases:
      - b
    cmds:
      - docker compose run --rm dev pnpm run build
    desc: Run the production-like server

  dev:
    aliases:
      - d
    cmds:
      - docker compose up --detach --remove-orphans dev
      - echo "Access at http://localhost:5173/"
    desc: Run the development server

  prod:
    aliases:
      - p
    cmds:
      - docker compose up --detach --remove-orphans prod
      - echo "Access at http://localhost:4173/"
    desc: Run the production-like server
    deps:
      - build

  stop:
    aliases:
      - s
    cmds:
      - docker compose down -v --remove-orphans
    desc: Stop and remove the presentation containers
