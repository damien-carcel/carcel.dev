version: 3

tasks:
  build:
    aliases:
      - b
    cmds:
      - bun run --bun build
    desc: Run the production-like server

  dev:
    aliases:
      - d
    cmds:
      - bun run --bun dev
    desc: Run the development server

  prod:
    aliases:
      - p
    cmds:
      - bun run --bun preview
    desc: Run the production-like server
    deps:
      - build
