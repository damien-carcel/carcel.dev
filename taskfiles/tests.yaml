version: "3"

tasks:
  static:format:check:
    aliases:
      - f:c
    cmds:
      - bun run prettier --check
    desc: Check the code style

  static:format:fix:
    aliases:
      - f:f
    cmds:
      - bun run prettier --write
    desc: Fix the code style

  static:style-sheet:lint:
    aliases:
      - s:l
    cmds:
      - bun run stylelint
    desc: Lint the style sheets

  static:style-sheet:fix:
    aliases:
      - s:f
    cmds:
      - bun run stylelint --fix
    desc: Fix the style sheets

  static:code:lint:
    aliases:
      - c:l
    cmds:
      - bun run lint {{.CLI_ARGS}}
    desc: Lint the application code

  static:code:fix:
    aliases:
      - c:f
    cmds:
      - bun run lint --fix
    desc: Fix the application code

  static:types:check:
    aliases:
      - t:c
    cmds:
      - bun run typecheck
    desc: Check the code typing

  unit:
    aliases:
      - u:r
    cmds:
      - bun run test --run {{.CLI_ARGS}}
    desc: Run unit tests

  unit:update:
    aliases:
      - u:u
    cmds:
      - bun run test --update
    desc: Update unit test snapshots

  unit:watch:
    aliases:
      - u:w
    cmds:
      - bun run test --watch
    desc: Run unit tests in watch mode

  all:
    aliases:
      - a
    cmds:
      - echo ""
      - echo "|---------------------------|"
      - echo "| Check the code formatting |"
      - echo "|---------------------------|"
      - echo ""
      - task: static:format:check
      - echo ""
      - echo "|---------------------------|"
      - echo "|   Lint the style sheets   |"
      - echo "|---------------------------|"
      - echo ""
      - task: static:style-sheet:lint
      - echo ""
      - echo "|---------------------------|"
      - echo "| Lint the application code |"
      - echo "|---------------------------|"
      - echo ""
      - task: static:code:lint
      - echo ""
      - echo "|---------------------------|"
      - echo "|   Check the code typing   |"
      - echo "|---------------------------|"
      - echo ""
      - task: static:types:check
      - echo ""
      - echo "|---------------------------|"
      - echo "|      Run unit tests       |"
      - echo "|---------------------------|"
      - echo ""
      - task: unit
      - echo ""
      - echo "|---------------------------|"
      - echo "|   All tests successful    |"
      - echo "|---------------------------|"
      - echo ""
    desc: Execute all the tests
